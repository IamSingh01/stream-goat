name: macOS

# Native macOS builds for Apple Silicon (arm64) and Intel (x86_64). Each DMG bundles matching Java, JavaFX, VLC and mpv.
# Build only when this Intel compatibility branch is updated.
# No pull-request workflow runs, avoiding PR-run failure notifications.
# Manual-only while the Intel macOS build is being stabilized.
# Avoid creating a new failing run for every small fix or commit.
on:
  workflow_dispatch:

# Cancel an older run when a newer commit arrives for the same PR or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # This compatibility branch targets Intel Macs only. Avoid running the unrelated
        # Apple Silicon job, whose Homebrew media dependencies are not part of this build.
        include:
          - arch: x86_64
            runner: macos-15-intel
            vlc_arch: intel64
            fx_classifier: mac
            update_key: mac
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      MACOS_ARCH: ${{ matrix.arch }}
      VLC_ARCH: ${{ matrix.vlc_arch }}
      FX_CLASSIFIER: ${{ matrix.fx_classifier }}
      UPDATE_KEY: ${{ matrix.update_key }}
      VLC_VERSION: "3.0.21"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify native build architecture
        run: |
          actual="$(uname -m)"
          java_arch="$(java -XshowSettings:properties -version 2>&1 | awk '/^[[:space:]]*os.arch =/ {print $3}')"
          [ "$actual" = "$MACOS_ARCH" ] || { echo "::error::Expected $MACOS_ARCH runner, got $actual"; exit 1; }
          case "$MACOS_ARCH:$java_arch" in
            arm64:aarch64|x86_64:x86_64|x86_64:amd64) ;;
            *) echo "::error::Expected a $MACOS_ARCH JDK, got os.arch=$java_arch"; exit 1 ;;
          esac
          echo "Building natively: macOS $actual; Java os.arch=$java_arch"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch pinned upstream sources
        run: ./scripts/fetch-upstream.sh

      - name: VLC for ${{ matrix.arch }}
        # VideoLAN's matching arm64 or intel64 build; only the engine (lib/ and plugins/) is bundled.
        run: |
          base="https://download.videolan.org/pub/videolan/vlc/$VLC_VERSION/macosx"
          vlc_file="vlc-$VLC_VERSION-$VLC_ARCH.dmg"
          curl -fsSL --retry 3 -o vlc.dmg "$base/$vlc_file"
          actual=$(shasum -a 256 vlc.dmg | cut -d' ' -f1)
          if curl -fsSL --retry 3 -o vlc.dmg.sha256 "$base/$vlc_file.sha256"; then
            expected=$(cut -d' ' -f1 vlc.dmg.sha256)
            [ "$expected" = "$actual" ] || { echo "::error::VLC download checksum mismatch ($actual, expected $expected)"; exit 1; }
            echo "VLC checksum OK: $actual"
          else
            echo "::warning::VideoLAN published no .sha256 for this file; downloaded sha256 is $actual"
          fi
          hdiutil attach -nobrowse -readonly -mountpoint /Volumes/vlc vlc.dmg > /dev/null
          src="/Volumes/vlc/VLC.app/Contents/MacOS"
          mkdir -p vlc
          cp -RL "$src/lib" vlc/
          cp -RL "$src/plugins" vlc/
          hdiutil detach /Volumes/vlc > /dev/null
          rm -f vlc/plugins/libmacosx_plugin.dylib vlc/plugins/liblua_plugin.dylib
          # VLC's plugin cache records file dates; copied and re-signed files make it stale (slower start). VLC
          # scans the folder itself without it.
          rm -f vlc/plugins/plugins.dat
          ls vlc/lib
          du -sh vlc
          echo "VLC_DIR=$PWD/vlc" >> "$GITHUB_ENV"

      - name: mpv for ${{ matrix.arch }}
        # libmpv (FFmpeg inside), the main player: Homebrew's, with the libraries it needs copied beside it.
        run: |
          brew install mpv dylibbundler > /dev/null
          mkdir -p mpv
          cp "$(brew --prefix mpv)/lib/libmpv.2.dylib" mpv/
          chmod u+w mpv/libmpv.2.dylib
          dylibbundler -of -b -x mpv/libmpv.2.dylib -d mpv/ -p @loader_path/ > /dev/null
          codesign --force --sign - mpv/*.dylib > /dev/null
          ls mpv | head -40
          du -sh mpv
          echo "MPV_DIR=$PWD/mpv" >> "$GITHUB_ENV"

      - name: Verify bundled VLC and mpv architectures
        run: |
          verify_dylibs() {
            local dir="$1"
            local found=0
            while IFS= read -r -d '' library; do
              found=1
              if ! lipo -verify_arch "$MACOS_ARCH" "$library" >/dev/null 2>&1; then
                echo "::error file=$library::Expected $MACOS_ARCH native library"
                exit 1
              fi
            done < <(find "$dir" -type f -name '*.dylib' -print0)
            [ "$found" -eq 1 ] || { echo "::error::No dylibs found under $dir"; exit 1; }
          }
          verify_dylibs "$VLC_DIR"
          verify_dylibs "$MPV_DIR"

      - name: Update signing certificate
        # Built into the app, so it can check the signature of small updates (packaging/update/ci.sh).
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./packaging/update/ci.sh cert

      - name: Test
        # The same tests as on Linux and Windows: extensions (.cs3 and .jar), sources, the header proxy, subtitles,
        # downloads, backup and libVLC playback with the bundled VLC.
        run: |
          if ! ./gradlew :app:test -PvlcDir="$VLC_DIR/lib" -PmpvDir="$MPV_DIR"; then
            python - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob("app/build/test-results/test/*.xml"):
              for case in ET.parse(f).getroot().iter("testcase"):
                  for fail in list(case.findall("failure")) + list(case.findall("error")):
                      msg = (fail.get("message") or fail.text or "").replace("\n", " ")[:400]
                      print(f"::error title={case.get('classname').split('.')[-1]}: {case.get('name')[:80]}::{msg}")
          PY
            exit 1
          fi

      - name: Mac app and disk image (.dmg) for ${{ matrix.arch }}
        env:
          # Google Drive backup: the project's Google sign-in client (docs/google-drive-setup.md); empty without it.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          WETRAKR_CLIENT_ID: ${{ secrets.WETRAKR_CLIENT_ID }}
        run: |
          ./gradlew :app:packageMac -PvlcDir="$VLC_DIR" -PmpvDir="$MPV_DIR"
          app="app/build/jpackage-mac/RoarStream.app"
          icon="app/build/generated/branding/RoarStream.icns"
          test -s "$icon"
          iconutil -test -v -i "$icon"
          sips -g pixelWidth -g pixelHeight "$icon"
          # Confirm the iconset includes all expected standard and Retina renditions.
          for size in icon_16x16.png icon_16x16@2x.png icon_32x32.png icon_32x32@2x.png \
                      icon_128x128.png icon_128x128@2x.png icon_256x256.png icon_256x256@2x.png \
                      icon_512x512.png icon_512x512@2x.png; do
            test -s "app/build/generated/branding/RoarStream.iconset/$size"
          done
          # No Apple developer certificate: sign it ad hoc for CI installation and execution.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app" && echo "signature OK"
          ./gradlew :app:packageMac -PvlcDir="$VLC_DIR" -PmpvDir="$MPV_DIR" -PjpackageType=dmg
          VERSION=$(grep -o 'VERSION = "[^"]*"' app/src/main/kotlin/com/lagradost/cloudstream3/linux/ui/AppWindow.kt | cut -d'"' -f2)
          mkdir -p build/macos
          cp app/build/jpackage-mac/RoarStream-*.dmg "build/macos/roarstream-macos-$MACOS_ARCH-$VERSION.dmg"
          dmg="build/macos/roarstream-macos-$MACOS_ARCH-$VERSION.dmg"
          test -s "$dmg"
          hdiutil verify "$dmg"
          hdiutil attach -nobrowse -readonly -mountpoint /Volumes/roarstream-check "$dmg"
          test -d /Volumes/roarstream-check/RoarStream.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' /Volumes/roarstream-check/RoarStream.app/Contents/Info.plist | grep -Fx 'RoarStream'
          hdiutil detach /Volumes/roarstream-check
          shasum -a 256 "$icon" "$dmg"
          ls -la build/macos
          du -sh "$app"

      - name: Update patch
        # RoarStream's own jars, signed: what the app downloads for a small update (Settings → Updates).
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./packaging/update/ci.sh make "$UPDATE_KEY"

      - name: Check packaged macOS architecture
        run: |
          app="app/build/jpackage-mac/RoarStream.app"
          lipo -verify_arch "$MACOS_ARCH" "$app/Contents/MacOS/RoarStream"
          runtime="$app/Contents/runtime/Contents/Home"
          lipo -verify_arch "$MACOS_ARCH" "$runtime/bin/java"
          while IFS= read -r -d '' library; do
            lipo -verify_arch "$MACOS_ARCH" "$library" >/dev/null || {
              echo "::error file=$library::Bundled runtime has the wrong architecture"; exit 1;
            }
          done < <(find "$runtime" -type f -name '*.dylib' -print0)
          fx_dir="$app/Contents/app"
          fx_count=$(find "$fx_dir" -maxdepth 1 -type f -name "javafx-*-21.0.8-$FX_CLASSIFIER.jar" | wc -l | tr -d ' ')
          [ "$fx_count" = "3" ] || {
            echo "::error::Expected three JavaFX 21.0.8 $FX_CLASSIFIER jars; found $fx_count"
            ls "$fx_dir"/javafx-*.jar || true
            exit 1
          }
          tmp=$(mktemp -d)
          for jar in "$fx_dir"/javafx-*-21.0.8-"$FX_CLASSIFIER".jar; do
            while IFS= read -r entry; do
              case "$entry" in
                *.dylib)
                  extracted="$tmp/$(basename "$jar")-$(basename "$entry")"
                  unzip -p "$jar" "$entry" > "$extracted"
                  lipo -verify_arch "$MACOS_ARCH" "$extracted" >/dev/null || {
                    echo "::error file=$jar::$entry is not $MACOS_ARCH"; exit 1;
                  }
                  ;;
              esac
            done < <(jar tf "$jar")
          done
          rm -rf "$tmp"
          echo "Verified $MACOS_ARCH app launcher, JDK and JavaFX native libraries."

      - name: Check the packaged app
        # The packaged app's own checker must find its Java, extensions folder and the bundled VLC.
        run: |
          app="app/build/jpackage-mac/RoarStream.app"
          out=$(CLOUDSTREAM_HOME="$PWD/doctor-home" "$app/Contents/MacOS/RoarStream" doctor 2>&1 || true)
          echo "$out"
          ls "$app/Contents/app/vlc/lib" | head
          if ! echo "$out" | grep -q "libVLC    3\."; then
            echo "$out" | tail -25 | while IFS= read -r line; do echo "::warning title=doctor::${line:0:300}"; done
            echo "::error::The packaged app didn't find its bundled VLC"; exit 1
          fi
          echo "$out" | grep -q "libmpv    yes" || { echo "::error::The packaged app didn't find its bundled libmpv"; exit 1; }

      - name: Screenshots of the app window
        # Starts the packaged app in screenshot mode (the same tours as on Linux); the pictures are in the artifact.
        # Not fatal: the .dmg is still published if the window can't be captured on the build machine.
        continue-on-error: true
        run: |
          mkdir -p shots
          app="$PWD/app/build/jpackage-mac/RoarStream.app/Contents/MacOS/RoarStream"
          ls -la "$(dirname "$app")"
          for tour in nav settings7; do
            # macOS has no timeout command: perl's alarm ends the app if a tour hangs. exec { name } list keeps
            # the path whole (a lone string would be split at the space in "RoarStream").
            start=$(date +%s)
            set +e
            CS_SCREENSHOT="$PWD/shots/mac-$tour" CS_SCREENSHOT_ONLY=$tour CLOUDSTREAM_HOME="$PWD/shot-home" \
              perl -e 'alarm 180; exec { $ARGV[0] } @ARGV or die "exec failed: $!"' "$app" > "shot-$tour.log" 2>&1
            code=$?
            set -e
            echo "tour $tour: exit $code after $(( $(date +%s) - start )) s"
            tail -40 "shot-$tour.log" || true
          done
          echo "--- app log"; tail -60 shot-home/logs/cloudstream.log 2>/dev/null || true
          ls shots
          [ -n "$(ls shots)" ] || { echo "::error::No screenshots were taken"; exit 1; }
          pip install -q pillow
          python - <<'PY'
          import glob
          from PIL import Image
          for f in sorted(glob.glob("shots/*.png")):
              im = Image.open(f).convert("RGB")
              small = im.resize((200, int(200 * im.height / im.width)))
              colours = len(set(small.getdata()))
              print(f"::notice title=screenshot::{f.split('/')[-1]} {im.width}x{im.height}, {colours} colours")
              if colours < 50: print(f"::error::{f} looks blank")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roarstream-macos-${{ matrix.arch }}
          path: |
            build/macos/*.dmg
            shots/*.png
            shot-*.log

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/macos/*.dmg
            build/update/*

      - name: Test build (pull requests)
        # Also on the "test-build" pre-release (see build.yml), next to the Android and Windows files.
        if: (github.event_name == 'push' && github.ref == 'refs/heads/picture-keys') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'picture-keys')  # only the test branch, not small fixes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          target_commitish: ${{ github.event.pull_request.head.sha || github.sha }}
          name: Test build (not a release)
          prerelease: true
          make_latest: false
          files: |
            build/macos/*.dmg
            build/update/*

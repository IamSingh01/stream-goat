name: Web app (GitHub Pages)

# Publishes the website to https://sherazi5110.github.io/stream-goat/ :
#   /      the Stream Goat website (site/: about the app, downloads, screenshots)
#   /app/  the web version (webapp/: the browser version, using Stremio add-ons)
# This fork is maintained for Intel macOS; publish the web site only on deliberate request.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Put the website together
        env:
          # Google sign-in for the web version (a "Web application" client; docs/google-drive-setup.md). A web
          # page's client id is public anyway; without it the web version says sign-in isn't set up.
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          RATING_URL: ${{ vars.RATING_URL }}
        run: |
          mkdir -p _site/screenshots
          cp -r site/. _site/
          cp -r webapp _site/app
          if [ -n "$GOOGLE_WEB_CLIENT_ID" ]; then
            printf 'window.STREAMGOAT_CONFIG = { googleClientId: "%s" };\n' "$GOOGLE_WEB_CLIENT_ID" > _site/app/config.js
          fi
          cp packaging/linux/cloudstream-linux.svg _site/logo.svg
          # The "Rate Stream Goat" stars: the rating counter's address (repository variable RATING_URL, see
          # docs/rating-setup.md); empty keeps them hidden.
          printf 'window.STREAMGOAT_RATING_URL = "%s";\n' "$RATING_URL" > _site/rating-config.js
          cp docs/screenshots/*.jpg _site/screenshots/
          mkdir -p _site/releases
          cp docs/releases/*.md _site/releases/
          python3 -c 'import glob,json,os; print(json.dumps([os.path.basename(f)[:-3] for f in glob.glob("docs/releases/*.md")]))' > _site/releases/index.json
          ls -R _site | head -40
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
